<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#6c5ce7">
<title>ClassRate ⭐</title>
<script type="module">
  import { inject } from 'https://cdn.jsdelivr.net/npm/@vercel/analytics@2.0.1/dist/index.mjs';
  inject();
</script>
<style>
  :root{
    --bg:#f4f5fb; --card:#ffffff; --ink:#1d1f2b; --muted:#6b6f82;
    --line:#e7e8f1; --accent:#6c5ce7; --accent-soft:#efedff;
    --gold:#f6a609; --danger:#e0506b; --ok:#22a06b; --shadow:0 6px 24px rgba(28,25,68,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#12131c; --card:#1c1e2b; --ink:#eef0fa; --muted:#9aa0b8;
      --line:#2b2e40; --accent:#8d7ffa; --accent-soft:#262343; --shadow:0 6px 24px rgba(0,0,0,.4); }
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html{-webkit-text-size-adjust:100%}
  body{ background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
        min-height:100vh; display:flex; justify-content:center; }
  .app{ width:100%; max-width:540px; padding:0 16px 96px; }
  header.brand{ display:flex; align-items:center; gap:10px; padding:22px 2px 6px; }
  header.brand .logo{ width:40px;height:40px;border-radius:12px;background:var(--accent);color:#fff;
    display:grid;place-items:center;font-size:22px; box-shadow:var(--shadow); }
  header.brand h1{ font-size:22px; letter-spacing:.2px; }
  header.brand p{ color:var(--muted); font-size:13px; margin-top:1px; }
  main{ margin-top:14px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px;
         padding:18px; box-shadow:var(--shadow); }
  .hidden{ display:none !important; }

  h2.viewtitle{ font-size:17px; margin:4px 2px 12px; display:flex; align-items:center; gap:8px;}
  h2.viewtitle .spacer{flex:1}
  .muted{ color:var(--muted); font-size:13px; }

  label.f{ display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
  input[type=text], input[type=email]{ width:100%; padding:12px 14px; border-radius:12px;
    border:1px solid var(--line); background:transparent; color:var(--ink); font-size:16px; outline:none; }
  input[type=text]:focus, input[type=email]:focus{ border-color:var(--accent); }
  .consent{ display:flex; gap:10px; align-items:flex-start; margin-top:16px; font-size:13px; color:var(--muted); }
  .consent input{ margin-top:2px; }

  button{ font-family:inherit; cursor:pointer; border:none; border-radius:12px; font-size:15px; }
  .btn{ width:100%; padding:13px; background:var(--accent); color:#fff; font-weight:600; margin-top:18px; }
  .btn:disabled{ opacity:.55; cursor:default; }
  .btn.ghost{ background:var(--accent-soft); color:var(--accent); }
  .btn.danger{ background:transparent; color:var(--danger); border:1px solid var(--line); }
  .btn.small{ width:auto; padding:8px 14px; margin-top:0; font-size:13px; border-radius:10px; }

  .searchwrap{ position:sticky; top:0; background:var(--bg); padding:8px 0 10px; z-index:5; }

  .person{ border:1px solid var(--line); background:var(--card); border-radius:14px; margin-bottom:10px; overflow:hidden; }
  .person .row1{ display:flex; align-items:center; gap:12px; padding:12px 14px; cursor:pointer; }
  .avatar{ width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
    color:#fff;font-weight:700;font-size:16px; flex:none; }
  .person .nm{ font-weight:600; font-size:15px; }
  .person .sub{ color:var(--muted); font-size:12px; margin-top:1px; }
  .person .chev{ margin-left:auto; color:var(--muted); transition:transform .15s; }
  .person.open .chev{ transform:rotate(90deg); }
  .ratebox{ border-top:1px dashed var(--line); padding:6px 14px 14px; }
  .traitrow{ display:flex; align-items:center; gap:8px; padding:6px 0; }
  .traitrow .tl{ width:120px; font-size:13px; color:var(--muted); }
  .starbtns button{ background:none; font-size:26px; line-height:1; padding:2px 3px; color:#c9ccd8; }
  .starbtns button.on{ color:var(--gold); }

  .stars{ position:relative; display:inline-block; font-size:16px; line-height:1; color:#c9ccd8; letter-spacing:2px; }
  .stars .fg{ position:absolute; left:0; top:0; overflow:hidden; white-space:nowrap; color:var(--gold); }

  .chips{ display:flex; gap:8px; flex-wrap:wrap; margin:2px 0 14px; }
  .chip{ padding:7px 13px; border-radius:999px; background:var(--card); border:1px solid var(--line);
    color:var(--muted); font-size:13px; font-weight:600; }
  .chip.on{ background:var(--accent); border-color:var(--accent); color:#fff; }

  .lbrow{ display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:11px 14px; margin-bottom:9px; }
  .lbrow.me{ outline:2px solid var(--accent); }
  .rank{ width:30px; text-align:center; font-weight:700; color:var(--muted); font-size:14px; flex:none; }
  .lbrow .nm{ font-weight:600; font-size:15px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lbrow .score{ text-align:right; flex:none; }
  .lbrow .score .avg{ font-weight:700; color:var(--gold); font-size:14px; }
  .lbrow .score .cnt{ color:var(--muted); font-size:11px; }
  .lbempty{ text-align:center; color:var(--muted); padding:34px 10px; font-size:14px; }

  .metop{ display:flex; align-items:center; gap:14px; }
  .metop .avatar{ width:54px; height:54px; font-size:22px; }
  .metop .nm{ font-size:18px; font-weight:700; }
  .pill{ display:inline-block; font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; margin-top:4px; }
  .pill.ok{ background:rgba(34,160,107,.14); color:var(--ok); }
  .pill.grey{ background:rgba(120,120,140,.16); color:var(--muted); }
  .bar{ height:8px; border-radius:99px; background:var(--line); overflow:hidden; flex:1; }
  .bar .fill{ height:100%; background:var(--accent); border-radius:99px; }
  .mytrait{ display:flex; align-items:center; gap:10px; margin:12px 0; font-size:13px; }
  .mytrait .tl{ width:110px; color:var(--muted); }
  .mytrait .tv{ width:44px; text-align:right; font-weight:700; }

  nav.tabs{ position:fixed; left:50%; transform:translateX(-50%); bottom:14px; z-index:10;
    display:flex; gap:4px; background:var(--card); border:1px solid var(--line);
    border-radius:999px; padding:5px; box-shadow:var(--shadow); }
  nav.tabs button{ background:none; color:var(--muted); font-size:13px; font-weight:700;
    padding:9px 18px; border-radius:999px; display:flex; align-items:center; gap:6px; }
  nav.tabs button.on{ background:var(--accent); color:#fff; }

  #toast{ position:fixed; left:50%; bottom:78px; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--bg); padding:11px 18px; border-radius:999px; font-size:14px;
    opacity:0; pointer-events:none; transition:all .25s; z-index:20; max-width:88%; text-align:center; }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  #toast.err{ background:var(--danger); color:#fff; }

  .foot{ text-align:center; color:var(--muted); font-size:11px; margin-top:26px; }
</style>
</head>
<body>
<div class="app">
  <header class="brand">
    <div class="logo">⭐</div>
    <div>
      <h1>ClassRate</h1>
      <p>Rate your classmates — anonymous, positive, students only.</p>
    </div>
  </header>

  <main>
    <!-- ═══ JOIN ═══ -->
    <section id="view-join">
      <div class="card">
        <h2 class="viewtitle">Join with your school email</h2>
        <p class="muted">Only <b id="join-domain">@eq.edu.au</b> emails can join.
        Votes you cast are anonymous to everyone else.</p>
        <form id="join-form" autocomplete="off">
          <label class="f" for="j-name">Display name (how classmates see you)</label>
          <input id="j-name" type="text" maxlength="30" placeholder="e.g. Sam K" required>
          <label class="f" for="j-email">School email</label>
          <input id="j-email" type="email" placeholder="you@eq.edu.au" required>
          <label class="consent">
            <input id="j-consent" type="checkbox">
            <span>I agree to appear in the ratings, and I'll keep my votes respectful.
                  Positive ratings only — no negativity, no targeting.</span>
          </label>
          <button class="btn" id="j-btn" type="submit">Join ⭐</button>
        </form>
        <p class="foot">Rejoining with the same email restores your account on any device.</p>
      </div>
    </section>

    <!-- ═══ RATE ═══ -->
    <section id="view-rate" class="hidden">
      <h2 class="viewtitle">Rate classmates <span class="spacer"></span>
        <button class="btn ghost small" id="p-refresh">Refresh</button></h2>
      <div class="searchwrap">
        <input id="p-search" type="text" placeholder="Search names…">
      </div>
      <div id="people-list"></div>
    </section>

    <!-- ═══ LEADERBOARD ═══ -->
    <section id="view-board" class="hidden">
      <h2 class="viewtitle">Leaderboard 🏆 <span class="spacer"></span>
        <button class="btn ghost small" id="lb-refresh">Refresh</button></h2>
      <div class="chips" id="lb-chips"></div>
      <div id="lb-list"></div>
    </section>

    <!-- ═══ ME ═══ -->
    <section id="view-me" class="hidden">
      <h2 class="viewtitle">My profile</h2>
      <div class="card" id="me-card"></div>
      <button class="btn ghost" id="me-refresh" style="margin-top:12px">Refresh my data</button>
      <button class="btn danger" id="me-hide" style="margin-top:10px">Hide me from ratings</button>
      <button class="btn danger" id="me-logout" style="margin-top:10px">Sign out of this device</button>
    </section>
  </main>

  <nav class="tabs hidden" id="tabs">
    <button data-tab="rate" class="on">✋ Rate</button>
    <button data-tab="board">🏆 Board</button>
    <button data-tab="me">😎 Me</button>
  </nav>

  <div id="toast"></div>
</div>

<script>
'use strict';
/* ──────────────────────────────────────────────────────────────────────────
   If you keep this file on your PC and use it directly (double-click),
   paste your Vercel URL between the quotes on the next line, e.g.
   const PC_API_BASE = 'https://classrate.vercel.app';
   When the file is hosted on Vercel you can leave it empty.
   ─────────────────────────────────────────────────────────────────────── */
const PC_API_BASE = '';

const API = (location.protocol === 'file:' ? PC_API_BASE : (PC_API_BASE || location.origin));

/* ── state + tiny localStorage cache (keeps network requests minimal) ── */
const LS = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v === null || v === undefined ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const S = {
  cfg: null,            // { traits:[{id,label,emoji}], minVotes, allowedDomain }
  token: LS.get('cr_token', null),
  uid:   LS.get('cr_uid', null),
  name:  LS.get('cr_name', null),
  people: [], myVotes: {}, me: null,
  board: 'overall',
  drafts: {},           // open rating panels: uid -> {trait: score}
  tab: 'rate',
};

const $  = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function toast(msg, isErr) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(t._h); t._h = setTimeout(() => t.className = '', 2600);
}

async function api(path, opts = {}) {
  const r = await fetch(API + path, {
    method: opts.method || 'GET',
    headers: Object.assign(
      { 'content-type': 'application/json' },
      S.token ? { authorization: 'Bearer ' + S.token } : {}),
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  let j = {};
  try { j = await r.json(); } catch {}
  if (!r.ok) {
    if (r.status === 401) signOut(true);
    throw new Error(j.error || ('Request failed (' + r.status + ')'));
  }
  return j;
}

/* ── config (traits etc.) — cached 24h ── */
async function loadConfig() {
  const c = LS.get('cr_cfg', null);
  if (c && Date.now() - c.ts < 864e5) { S.cfg = c.data; return; }
  const data = await api('/api/config');
  S.cfg = data;
  LS.set('cr_cfg', { ts: Date.now(), data });
}
const traitById = (id) => S.cfg.traits.find(t => t.id === id) || { id, label: id, emoji: '⭐' };

/* ── views ── */
function showTab(tab) {
  S.tab = tab;
  for (const t of ['rate', 'board', 'me']) $('#view-' + t).classList.add('hidden');
  $('#view-' + tab).classList.remove('hidden');
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  if (tab === 'rate') loadPeople();
  if (tab === 'board') loadBoard();
  if (tab === 'me') loadMe();
}
function showApp() {
  $('#view-join').classList.add('hidden');
  $('#tabs').classList.remove('hidden');
  showTab(S.tab || 'rate');
}
function showJoin() {
  $('#tabs').classList.add('hidden');
  for (const t of ['rate', 'board', 'me']) $('#view-' + t).classList.add('hidden');
  $('#view-join').classList.remove('hidden');
}
function signOut(expired) {
  S.token = null; S.uid = null;
  LS.del('cr_token'); LS.del('cr_uid'); LS.del('cr_name');
  LS.del('cr_people');
  if (expired) toast('Signed out — join again to continue', true);
  showJoin();
}

/* ── join ── */
$('#join-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('#j-btn');
  const name = $('#j-name').value.trim();
  const email = $('#j-email').value.trim();
  if (!$('#j-consent').checked) return toast('Please tick the agreement box first', true);
  btn.disabled = true; btn.textContent = 'Joining…';
  try {
    const j = await api('/api/join', { method: 'POST', body: { name, email, consent: true } });
    S.token = j.token; S.uid = j.uid; S.name = j.name;
    LS.set('cr_token', j.token); LS.set('cr_uid', j.uid); LS.set('cr_name', j.name);
    LS.del('cr_people');
    toast('Welcome, ' + j.name + ' 👋');
    showApp();
    loadPeople(true);
    loadMe(true);
  } catch (err) { toast(err.message, true); }
  btn.disabled = false; btn.textContent = 'Join ⭐';
});

/* ── people (rate) ── */
async function loadPeople(force) {
  const c = LS.get('cr_people', null);
  if (!force && c && Date.now() - c.ts < 300e3) { S.people = c.data.people; S.myVotes = c.data.myVotes; renderPeople(); return; }
  try {
    const j = await api('/api/people');
    S.people = j.people; S.myVotes = j.myVotes; S.uid = j.you;
    LS.set('cr_people', { ts: Date.now(), data: { people: j.people, myVotes: j.myVotes } });
    renderPeople();
  } catch (err) { toast(err.message, true); }
}

function colorFor(name) {
  const hues = [262, 200, 330, 20, 160, 120];
  let hsh = 0; for (const ch of name) hsh = (hsh * 31 + ch.charCodeAt(0)) % 997;
  return 'hsl(' + hues[hsh % hues.length] + ' 70% 60%)';
}

function renderPeople() {
  const q = ($('#p-search').value || '').toLowerCase();
  const list = S.people.filter(p => p.name.toLowerCase().includes(q));
  const box = $('#people-list');
  if (!list.length) {
    box.innerHTML = '<div class="lbempty">No classmates found yet.<br>Share the link so people join! 🎉</div>';
    return;
  }
  box.innerHTML = list.map(p => {
    const mine = S.myVotes[p.uid] || {};
    const given = Object.keys(mine).length;
    const open = !!S.drafts[p.uid];
    return `
    <div class="person ${open ? 'open' : ''}" data-uid="${p.uid}">
      <div class="row1" data-act="toggle">
        <div class="avatar" style="background:${colorFor(p.name)}">${esc(p.name[0].toUpperCase())}</div>
        <div>
          <div class="nm">${esc(p.name)}${p.uid === S.uid ? ' <span class="muted">(you)</span>' : ''}</div>
          <div class="sub">${given ? 'You rated ' + given + ' trait' + (given > 1 ? 's' : '') : 'Tap to rate'}</div>
        </div>
        <div class="chev">›</div>
      </div>
      ${open ? rateBox(p.uid) : ''}
    </div>`;
  }).join('');
}

function rateBox(uid) {
  const d = S.drafts[uid] || (S.drafts[uid] = Object.assign({}, S.myVotes[uid] || {}));
  const rows = S.cfg.traits.map(t => {
    const cur = d[t.id] || 0;
    const stars = [1,2,3,4,5].map(n =>
      `<button type="button" data-act="star" data-uid="${uid}" data-trait="${t.id}" data-n="${n}" class="${n <= cur ? 'on' : ''}">★</button>`
    ).join('');
    return `<div class="traitrow"><div class="tl">${t.emoji} ${esc(t.label)}</div><div class="starbtns">${stars}</div></div>`;
  }).join('');
  if (uid === S.uid) return '<div class="ratebox muted">You can\'t rate yourself 🙂</div>';
  return `<div class="ratebox">${rows}
    <button class="btn" data-act="save" data-uid="${uid}" style="margin-top:10px">Save ratings</button></div>`;
}

$('#people-list').addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, uid = el.dataset.uid;
  if (act === 'toggle') {
    if (S.drafts[uid]) delete S.drafts[uid]; else S.drafts[uid] = Object.assign({}, S.myVotes[uid] || {});
    renderPeople();
  } else if (act === 'star') {
    const t = el.dataset.trait, n = parseInt(el.dataset.n, 10);
    S.drafts[uid][t] = (S.drafts[uid][t] === n ? 0 : n); // tap same star again to clear
    if (!S.drafts[uid][t]) delete S.drafts[uid][t];
    renderPeople();
  } else if (act === 'save') {
    const ratings = S.drafts[uid];
    if (!Object.keys(ratings).length) return toast('Tap some stars first 🙂', true);
    el.disabled = true; el.textContent = 'Saving…';
    try {
      await api('/api/vote', { method: 'POST', body: { targetUid: uid, ratings } });
      S.myVotes[uid] = Object.assign({}, S.myVotes[uid] || {}, ratings);
      const c = LS.get('cr_people', null);
      if (c) { c.data.myVotes = S.myVotes; LS.set('cr_people', c); }
      delete S.drafts[uid];
      toast('Saved anonymously ✅');
      renderPeople();
    } catch (err) { toast(err.message, true); el.disabled = false; el.textContent = 'Save ratings'; }
    for (const b of Object.keys(localStorage)) if (b.indexOf('cr_lb_') === 0) LS.del(b); // stale boards
  }
});
$('#p-search').addEventListener('input', renderPeople);
$('#p-refresh').addEventListener('click', () => loadPeople(true));

/* ── leaderboard ── */
function renderChips() {
  const all = [{ id: 'overall', label: 'Overall', emoji: '🌟' }, ...S.cfg.traits];
  $('#lb-chips').innerHTML = all.map(t =>
    `<button class="chip ${S.board === t.id ? 'on' : ''}" data-board="${t.id}">${t.emoji} ${esc(t.label)}</button>`
  ).join('');
}
$('#lb-chips').addEventListener('click', (e) => {
  const c = e.target.closest('.chip'); if (!c) return;
  S.board = c.dataset.board; renderChips(); loadBoard();
});
$('#lb-refresh').addEventListener('click', () => loadBoard(true));

async function loadBoard(force) {
  renderChips();
  const key = 'cr_lb_' + S.board;
  const c = LS.get(key, null);
  if (!force && c && Date.now() - c.ts < 120e3) { renderBoardRows(c.data); return; }
  $('#lb-list').innerHTML = '<div class="lbempty">Loading…</div>';
  try {
    const j = await api('/api/leaderboard?board=' + encodeURIComponent(S.board));
    LS.set(key, { ts: Date.now(), data: j });
    renderBoardRows(j);
  } catch (err) { toast(err.message, true); $('#lb-list').innerHTML = ''; }
}

function starVis(avg) {
  const pct = Math.max(0, Math.min(100, (avg / 5) * 100));
  return `<span class="stars"><span class="bg">★★★★★</span><span class="fg" style="width:${pct}%">★★★★★</span></span>`;
}

function renderBoardRows(j) {
  const box = $('#lb-list');
  if (!j.rows.length) {
    box.innerHTML = `<div class="lbempty">No one on this board yet —<br>students need ${S.cfg.minVotes}+ ratings to rank. ⭐</div>`;
    return;
  }
  const medals = { 1: '🥇', 2: '🥈', 3: '🥉' };
  box.innerHTML = j.rows.map(r => `
    <div class="lbrow ${r.uid === S.uid ? 'me' : ''}">
      <div class="rank">${medals[r.rank] || r.rank}</div>
      <div class="avatar" style="background:${colorFor(r.name)};width:34px;height:34px;font-size:14px">${esc(r.name[0].toUpperCase())}</div>
      <div class="nm">${esc(r.name)}${r.uid === S.uid ? ' <span class="muted">(you)</span>' : ''}</div>
      <div class="score">${starVis(r.avg)}<div class="cnt">${r.avg.toFixed(1)} · ${r.count} ratings</div></div>
    </div>`).join('');
}

/* ── me ── */
async function loadMe(force) {
  if (!force && S.me && Date.now() - S.me.ts < 60e3) { renderMe(S.me.data); return; }
  try {
    const j = await api('/api/me');
    S.me = { ts: Date.now(), data: j };
    renderMe(j);
  } catch (err) { toast(err.message, true); }
}

function renderMe(j) {
  const bar = (avg) => `<div class="bar"><div class="fill" style="width:${(avg / 5) * 100}%"></div></div>`;
  $('#me-card').innerHTML = `
    <div class="metop">
      <div class="avatar" style="background:${colorFor(j.name)}">${esc(j.name[0].toUpperCase())}</div>
      <div>
        <div class="nm">${esc(j.name)}</div>
        <div class="muted">Overall ${j.overall.count ? '⭐ ' + j.overall.avg.toFixed(1) : '—'} · ${j.votesReceived} rating${j.votesReceived === 1 ? '' : 's'} received</div>
        ${j.hidden ? '<span class="pill grey">HIDDEN — you can\'t be rated</span>'
          : j.ranked ? '<span class="pill ok">RANKED on the boards</span>'
          : `<span class="pill grey">Need ${j.needVotes} more rating${j.needVotes === 1 ? '' : 's'} to rank</span>`}
      </div>
    </div>
    <div style="margin-top:16px">
      ${S.cfg.traits.map(t => {
        const v = j.traits[t.id];
        return `<div class="mytrait"><div class="tl">${t.emoji} ${esc(t.label)}</div>${bar(v.avg)}
          <div class="tv">${v.count ? v.avg.toFixed(1) : '—'}</div></div>`;
      }).join('')}
    </div>`;
}
$('#me-refresh').addEventListener('click', () => loadMe(true));
$('#me-logout').addEventListener('click', () => signOut(false));
$('#me-hide').addEventListener('click', async () => {
  if (!confirm('Hide yourself? You will be removed from the people list and all boards (you can rejoin later).')) return;
  try {
    await api('/api/optout', { method: 'POST' });
    S.me = null;
    toast('You are now hidden');
    loadMe(true);
  } catch (err) { toast(err.message, true); }
});

/* ── tab nav ── */
document.querySelectorAll('nav.tabs button').forEach(b =>
  b.addEventListener('click', () => showTab(b.dataset.tab)));

/* ── boot ── */
(async function init() {
  try { await loadConfig(); } catch (e) {
    toast('Could not reach the server — check your connection', true);
  }
  if (S.cfg) $('#join-domain').textContent = '@' + S.cfg.allowedDomain;
  if (S.token && S.cfg) { showApp(); loadMe(true); }
  else showJoin();
})();
</script>
</body>
</html>
